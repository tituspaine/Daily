<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily – Studio Teleprompter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Studio Header -->
    <header class="studio-header">
        <div class="studio-logo">
            <span class="logo-dot"></span>
            <span class="logo-text">DAILY</span>
        </div>
        <div class="studio-tagline">Studio Teleprompter</div>
        <div class="audio-meter-wrap">
            <span class="meter-label">MIC</span>
            <div class="audio-meter" id="audioMeter">
                <div class="audio-bar" id="audioBar"></div>
            </div>
        </div>
    </header>

    <div class="studio-layout">

        <!-- Camera Column -->
        <div class="camera-column">
            <div class="camera-frame">
                <video id="cameraPreview" autoplay muted playsinline></video>
                <!-- Countdown overlay -->
                <div class="countdown-overlay" id="countdownOverlay" style="display:none;">
                    <span id="countdownNumber">3</span>
                </div>
                <!-- Recording badge -->
                <div class="recording-indicator" id="recordingIndicator">
                    <span class="recording-dot"></span>
                    REC
                </div>
                <!-- Lower-third name bar -->
                <div class="lower-third" id="lowerThird" style="display:none;">
                    <div class="lower-third-name" id="lowerThirdName">ON AIR</div>
                    <div class="lower-third-title">Daily Presenter</div>
                </div>
            </div>

            <!-- Recording Controls -->
            <div class="controls-section">
                <button id="recordBtn" class="btn btn-record">&#9679; Record</button>
                <button id="stopBtn" class="btn btn-stop" disabled>&#9632; Stop</button>
                <button id="saveBtn" class="btn btn-save" disabled>&#8681; Save</button>
                <button id="discardBtn" class="btn btn-discard" disabled>&#10005; Discard</button>
            </div>

            <!-- Status -->
            <div id="statusMessage" class="status-message"></div>
        </div>

        <!-- Teleprompter Column -->
        <div class="teleprompter-column">
            <div class="teleprompter-header">
                <span class="tp-label">TELEPROMPTER</span>
                <div class="tp-controls-row">
                    <button id="teleprompterPlayBtn" class="btn btn-tp-play">&#9654; Play</button>
                    <div class="speed-control">
                        <label for="speedSlider">Speed</label>
                        <input id="speedSlider" type="range" min="20" max="200" value="60" />
                        <span id="speedValue">60</span>
                    </div>
                </div>
            </div>

            <!-- Script edit area -->
            <textarea
                id="teleprompterText"
                placeholder="Paste your script here…"
                spellcheck="false"
            ></textarea>
            <div class="tp-footer">
                <span class="char-count" id="charCount">0 characters</span>
                <button id="clearScriptBtn" class="btn-link">Clear</button>
            </div>
        </div>

    </div>

    <!-- Permission Prompt -->
    <div id="permissionPrompt" class="permission-prompt" style="display: none;">
        <div class="permission-content">
            <div class="perm-icon">&#127909;</div>
            <h2>Camera &amp; Microphone</h2>
            <p>Daily needs access to your camera and microphone to record presenter videos.</p>
            <button id="allowBtn" class="btn btn-record">Allow Access</button>
            <button id="denyBtn" class="btn btn-discard">Not now</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
